receivers:

  hostmetrics:
    collection_interval: 15s
    root_path: /hostfs

    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 15s

  filelog:
    include:
      - /docker_data/containers/*/*.log
    start_at: beginning

processors:
  batch:

exporters:
  otlp:
    endpoint: localhost:4317
    tls:
      insecure: true

service:
  pipelines:

    metrics:
      receivers:
        - hostmetrics
        - docker_stats
      processors:
        - batch
      exporters:
        - otlp

    logs:
      receivers:
        - filelog
      processors:
        - batch
      exporters:
        - otlp